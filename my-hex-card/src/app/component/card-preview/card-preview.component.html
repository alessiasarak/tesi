
<div [ngClass]="myMainClass" [style]="myMainStyle">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <div class="flex flex-col items-end" *ngIf="edit">
      <a href="/card-settings/{{card.token}}" type="submit" class="flex mb-3 rounded-3xl !text-primary bg-background_color p-2">
        <mat-icon>edit</mat-icon>
      </a>  
    </div>


    <div class="flex flex-col mb-2">
        <div class="flex flex-col items-center">
            <div class="w-36 h-36 overflow-hidden rounded-full">
              <img src="{{ card.img }}" class="object-cover w-full h-full">
            </div>
        
            <h4 class="flex mb-1 font-bold text-left text-2xl">{{ card.name }} {{ card.surname }}</h4>
            <h5 class="flex mt-3 text-left">{{ card.company }}</h5>
            <h5 class="flex mb-3 text-left">{{ card.function }}</h5>

            <button [ngClass]="myButtonClass" [style]="myButtonStyle">AGGIUNGI AI CONTATTI</button>
        </div>

        <hr class="flex mt-3 mb-3">

        <div class="center" class="flex flex-col">
            <div *ngFor="let email of card.email" class="flex flex-row mb-3" >
                <mat-icon aria-hidden="false" fontIcon="email" class="flex"></mat-icon>
                <span class="flex ml-3">{{ email.email }}</span>
            </div>

            <div *ngFor="let number of card.phone_number" class="flex flex-row mb-3">
                <mat-icon aria-hidden="false" fontIcon="phone" class="flex"></mat-icon>
                <span class="flex ml-3">{{ number.number }}</span>
            </div>

            <div *ngFor="let website of card.link" class="flex flex-row mb-3">
                <mat-icon aria-hidden="false" fontIcon="link" class="flex"></mat-icon>
                <a class="flex ml-3">{{ website.link }}</a>
            </div>

            <div *ngFor="let address of card.address" class="flex flex-row mb-3">
                <mat-icon aria-hidden="false" fontIcon="location_on" class="flex"></mat-icon>
                <span class="flex ml-3">{{ address.street_name }} {{ address.street_number }}, {{ address.cap }} {{ address.city }}, {{ address.nation }}</span>
            </div>
        </div>

        <hr class="flex mt-3 mb-3">
