<div class="flex flex-row justify-between z-10 bg-black  text-secondary p-4 pt-8">
    <button type="button" class="flex">
        <mat-icon class="flex">arrow_back</mat-icon>
    </button>
    
    <button (click)="menu()" id="menuButton" class="flex z-30">
        <mat-icon *ngIf="!isVisible">menu</mat-icon>
        <mat-icon *ngIf="isVisible">close</mat-icon>
    </button>
</div>


<div *ngIf="isVisible" class="obscure z-10"></div>
<div class="z-20 absolute top-0 min-h-screen w-52 text-secondary bg-black pt-16 transition-all duration-1000"
    [ngClass]="!isVisible ? '-right-52' : 'right-0'">
    <a href="/login">Login</a>
    <a href="https://hexcard.ch/store/" target="_blank">Compra la card</a>
    <a href="https://hexcard.ch/contatti/">Aiuto?</a>
</div>
