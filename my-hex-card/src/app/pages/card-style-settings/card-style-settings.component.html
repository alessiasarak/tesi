<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-header">
                    <h3>Impostazioni colori carta</h3>
                </div>
                <div class="card">
                    <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
                        
                        <div class="form-group">
                            <label for="backgroundColor">Colore sfondo: </label>
                            <input type="color" class="form-control" id="backgroundColor" formControlName="backgroundColor" />
                        </div>
                        
                        <div class="form-group">
                            <label for="textColor">Colore sfondo: </label>
                            <input type="color" class="form-control" id="textColor" formControlName="textColor" />
                        </div>
                        
                        <div class="form-group">
                            <label for="buttonColor">Colore sfondo: </label>
                            <input type="color" class="form-control" id="buttonColor" formControlName="buttonColor" />
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Save Change</button>
                    </form>
                </div>
            </div>
        </div>    
    </div>    
</div>
