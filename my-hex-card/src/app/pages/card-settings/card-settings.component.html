<div class="flex flex-col mt-10 items-center">
    <div class="flex flex-col w-96 shadow-xl p-8 rounded-3xl">
        
        <h3 class="flex text-xl font-bold mb-3">
            <app-my-button path="/settings"></app-my-button>
            Impostazioni dati carta
        </h3>

        <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
            
            <div class="flex flex-col mb-2">
                <div class="flex flex-col items-center">
                    <img src="https://bootdey.com/img/Content/avatar/avatar6.png" class="flex h-1/4 mb-3 rounded-full">
                </div>
            </div>

            <hr class="my-4" />

            <div class="flex flex-col mb-3 w-80">
                <label for="title">Title</label>
                <input type="text" class="form-control" id="title" formControlName="title" placeholder="title">
            </div>

            <div class="flex flex-col mb-3 w-80">
                <label for="subtitle">Title</label>
                <input type="text" class="form-control" id="subtitle" formControlName="subtitle" placeholder="subtitle">
            </div>

            <div class="flex flex-col mb-3 w-80">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="inputEmail" formControlName="emails" placeholder="Email">
            </div>
            
            <div class="flex flex-col mb-3 w-80">
                <label for="inputPhoneNumber">Phone number</label>
                <input type="text" class="form-control" id="inputPhoneNumber" formControlName="phoneNumbers" />
            </div>
            
            <div class="flex flex-col mb-3 w-80">
                <label for="inputLink">Link</label>
                <input type="text" class="form-control" id="inputLink" formControlName="links" />
            </div>
            
            <div class="flex flex-col mb-3 w-80">
                <label for="inputInstagramLink">Link Instagram  (lasciare vuoto se nessuno)</label>
                <input type="text" class="form-control" id="inputInstagramLink" formControlName="instagram" />
            </div>
            
            <div class="flex flex-col mb-3 w-80">
                <label for="inputFacebookLink">Link Facebook  (lasciare vuoto se nessuno)</label>
                <input type="text" class="form-control" id="inputFacebookLink" formControlName="facebook" />
            </div>

            <div class="flex flex-col mb-3 w-80">
                <label for="inputLinkedinLink">Link Linkedin (lasciare vuoto se nessuno)</label>
                <input type="text" class="form-control" id="inputLinkedinLink" formControlName="linkedin" />
            </div>

            <hr class="my-4" />
            
            <div class="flex flex-col items-center">
                <button type="submit" class="flex bg-slate-200 pl-8 pr-8 pt-2 pb-2 mb-3 rounded-3xl">Save change</button>
            </div>
        </form>
    </div>
</div>
