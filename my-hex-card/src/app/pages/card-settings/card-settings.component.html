<div class="flex xl:flex-row xl:w-full sm:flex-col justify-center">
    <div class="flex flex-col mt-10 items-center ml-10 mb-10">
        <div class="flex flex-col w-96 shadow-xl p-8 rounded-3xl">
            
            <h3 class="flex text-xl font-bold mb-3">
                <app-my-button path="/settings"></app-my-button>
                Impostazioni dati carta
            </h3>

            <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
                
                <div class="flex flex-col mb-2">
                    <div class="flex flex-col items-center">
                        <img src="{{ card.img }}" class="flex h-1/4 mb-3 rounded-full">
                    </div>
                </div>

                <div class="flex flex-col mb-3 w-80">
                    <label for="img">Image</label>
                    <input type="file" accept="image/*" (change)="processFile($event)" class="form-control" id="img" formControlName="img" placeholder="Image">
                </div>

                <hr class="my-4" />

                <div class="flex flex-col mb-3 w-80">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" formControlName="name" placeholder="name">
                </div>

                <div class="flex flex-col mb-3 w-80">
                    <label for="surname">Surname</label>
                    <input type="text" class="form-control" id="surname" formControlName="surname" placeholder="surname">
                </div>

                <div class="flex flex-col mb-3 w-80">
                    <label for="company">Company</label>
                    <input type="text" class="form-control" id="company" formControlName="company" placeholder="company">
                </div>

                <div class="flex flex-col mb-3 w-80">
                    <label for="function">Function</label>
                    <input type="text" class="form-control" id="function" formControlName="function" placeholder="function">
                </div>

                <div class="flex flex-col mb-3 w-80">
                    <label for="inputEmail">Email</label>
                    <input type="email" class="form-control" id="inputEmail" formControlName="emails" placeholder="Email">
                </div>
                
                <div class="flex flex-col mb-3 w-80">
                    <label for="inputPhoneNumber">Phone number</label>
                    <input type="text" class="form-control" id="inputPhoneNumber" formControlName="phoneNumbers" />
                </div>
                
                <div class="flex flex-col mb-3 w-80">
                    <label for="inputLink">Link</label>
                    <input type="text" class="form-control" id="inputLink" formControlName="links" />
                </div>
                
                <div class="flex flex-col mb-3 w-80">
                    <label for="inputInstagramLink">Link Instagram  (lasciare vuoto se nessuno)</label>
                    <input type="text" class="form-control" id="inputInstagramLink" formControlName="instagram" />
                </div>
                
                <div class="flex flex-col mb-3 w-80">
                    <label for="inputFacebookLink">Link Facebook  (lasciare vuoto se nessuno)</label>
                    <input type="text" class="form-control" id="inputFacebookLink" formControlName="facebook" />
                </div>

                <div class="flex flex-col mb-3 w-80">
                    <label for="inputLinkedinLink">Link Linkedin (lasciare vuoto se nessuno)</label>
                    <input type="text" class="form-control" id="inputLinkedinLink" formControlName="linkedin" />
                </div>

                <hr class="my-4" />
                
                <div class="flex flex-col items-center">
                    <button type="submit" class="flex bg-slate-200 pl-8 pr-8 pt-2 pb-2 mb-3 rounded-3xl">Save change</button>
                </div>
            </form>
        </div>
    </div>

    <div class="flex flex-col mt-10 items-center ml-10">
        <div class="flex flex-col w-96 shadow-xl p-8 rounded-3xl">
            
            <h3 class="flex text-xl font-bold mb-3">
                Impostazioni stile carta
            </h3>

            <form [formGroup]="myStyleForm" (ngSubmit)="onStyleSubmit()">
                
                <div class="flex flex-row mb-3 w-80">
                    <label for="backgroundColor" class="flex w-4/5">Colore sfondo: </label>
                    <input type="color" id="backgroundColor" formControlName="backgroundColor" />
                </div>
                
                <div class="flex flex-row mb-3 w-80">
                    <label for="textColor" class="flex w-4/5">Colore del testo: </label>
                    <input type="color" id="textColor" formControlName="textColor"/>
                </div>
                
                <div class="flex flex-row mb-3 w-80">
                    <label for="buttonColor" class="flex w-4/5">Colore del bottone: </label>
                    <input type="color" id="buttonColor" formControlName="buttonColor" />
                </div>
                
                <div class="flex flex-col items-center">
                    <button type="submit" class="flex bg-slate-200 pl-8 pr-8 pt-2 pb-2 mb-3 rounded-3xl">Save change</button>
                </div>
            </form>
        </div>    
    </div>

    <div class="flex flex-col mt-10 mb-10 items-center ml-10">
        <div [ngClass]="myMainClass" [style]="myMainStyle">
            
            <h3 class="flex text-xl font-bold mb-3">
                Preview
            </h3>

            <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

            <div class="flex flex-col mb-2">
                <div class="flex flex-col items-center">
                    <img src="{{ card.img }}" class="flex h-20 mb-3 rounded-full">
                    <h4 class="flex h-1/4 mb-1 font-bold text-left text-2xl">{{ card.name }} {{ card.surname }}</h4>
                    <h5 class="flex h-1/4 mb-3 text-left">{{ card.company }} {{ card.function }}</h5>

                    <button [ngClass]="myButtonClass" [style]="myButtonStyle">AGGIUNGI AI CONTATTI</button>
                </div>

                <hr class="flex mt-3 mb-3">

                <div class="center" class="flex flex-col">
                    <div *ngFor="let email of card.email" class="flex flex-row mb-3" >
                        <mat-icon aria-hidden="false" fontIcon="email" class="flex"></mat-icon>
                        <span class="flex ml-3">{{ email.email }}</span>
                    </div>

                    <div *ngFor="let number of card.phone_number" class="flex flex-row mb-3">
                        <mat-icon aria-hidden="false" fontIcon="phone" class="flex"></mat-icon>
                        <span class="flex ml-3">{{ number.number }}</span>
                    </div>

                    <div *ngFor="let website of card.link" class="flex flex-row mb-3">
                        <mat-icon aria-hidden="false" fontIcon="link" class="flex"></mat-icon>
                        <a href="https://{{ website.link }}" _target="_blank" class="flex ml-3">{{ website.link }}</a>
                    </div>
                </div>

                <hr class="flex mt-3 mb-3">

                <div class="flex w-full items-center text-center">
                    <div class="flex">Powered by Hexcard</div>
                </div>
            </div>
        </div>
    </div>
</div>
