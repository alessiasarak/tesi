<app-loading *ngIf="isLoading"></app-loading>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<div class="flex lg:flex-row lg:justify-between sm:flex-col lg:px-36 mt-20">
  
    <app-title title="La tua card" class="lg:hidden"></app-title>
    <app-subtitle subtitle="Modifica i dati ed il look della tua card" class="lg:hidden"></app-subtitle>

    <div class="flex flex-col mb-2 sm:hidden lg:flex lg:flex-col min-h-screen lg:w-1/3 mt-[270px]">
        <app-title title="La tua card"></app-title>
        <app-subtitle subtitle="Modifica i dati ed il look della tua card"></app-subtitle>

        <div class="lg:block mt-4" *ngIf="style">
            <button type="button"  (click)="setStyleFalse()" class="flex bg-primary  text-background_color text-medium_text pl-8 pr-8 pt-2 pb-2 mb-2 rounded-3xl">Modifica dati</button>
            <button type="button"  (click)="setStyleTrue()" class="flex bg-transparent  text-primary text-medium_text border border-primary pl-8 pr-8 pt-2 pb-2 mb-2 rounded-3xl">Modifica look</button>
        </div>
        <div class="lg:block mt-4" *ngIf="!style">
            <button type="button"  (click)="setStyleFalse()" class="flex bg-transparent  text-primary text-medium_text border border-primary pl-8 pr-8 pt-2 pb-2 mb-2 rounded-3xl">Modifica dati</button>
            <button type="button"  (click)="setStyleTrue()" class="flex bg-primary  text-background_color text-medium_text pl-8 pr-8 pt-2 pb-2 mb-2 rounded-3xl">Modifica look</button>
        </div>
       
        <div class="flex flex-col items-center mt-4 lg:hidden">
            <a href="/card-preview/{{card.token}}" class="bg-primary  text-background_color rounded-3xl p-2">Preview</a>
        </div>
    </div>


    

    <form *ngIf="!style" [formGroup]="myForm" (ngSubmit)="onSubmit()" class="lg:flex lg:flex-row lg:w-2/3 mt-4  lg:min-h-screen" >
        <div class="lg:flex lg:flex-col lg:mr-8 lg:w-1/2">
            <div class="flex flex-col mb-4 lg:m-0">
                <div class="flex flex-row justify-between align-middle lg:justify-center">
                    <div class="w-20 h-20 overflow-hidden rounded-full">
                        <img src="{{ card.img }}" class="object-cover w-full h-full">
                        <app-image-cropper 
                            [width]="80" 
                            [height]="80" 
                            (imageReady)="handleImageReady($event)" 
                        />
                    </div>
                    <div class="flex bg-primary  text-background_color justify-center align-middle text-medium_text rounded-3xl h-10 w-24 pt-3 lg:hidden">
                        <a href="/card-preview/{{card.token}}" class="flex">Preview</a>
                    </div>
                </div>
            </div>

            <div class="flex flex-col mb-2 lg:hidden">
                <div class="flex flex-row justify-between">
                    <button type="button"  (click)="setStyleFalse()" class="flex bg-primary  text-background_color text-medium_text pl-8 pr-8 pt-2 pb-2 mb-2 rounded-3xl">Modifica dati</button>
                    <button type="button"  (click)="setStyleTrue()" class="flex bg-transparent  text-primary text-medium_text border border-primary pl-8 pr-8 pt-2 pb-2 mb-2 rounded-3xl">Modifica look</button>
                </div>
            </div>

            <!-- <div class="flex flex-col mb-2 ">
                <label for="img">Immagine</label>
                <input type="file" accept=".jpg, .jpeg, .png" 
                (change)="processFile($event)" class="bg-secondary w-full p-2 rounded-md text-black" id="img" 
                formControlName="img" placeholder="Image" maxFileSize="5 * 1024 * 1024">
            </div>

            <hr class="my-4 lg:hidden border-[#acacac68]" /> -->

            <div class="flex flex-col mb-2 lg:mt-8">
                <label for="name">Nome</label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="name" formControlName="name" placeholder="Nome">
            </div>

            <div class="flex flex-col mb-2 ">
                <label for="surname">Cognome</label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="surname" formControlName="surname" placeholder="Cognome">
            </div>

            <div class="flex flex-col mb-2 ">
                <label for="company">Azienda</label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="company" formControlName="company" placeholder="Azienda">
            </div>

            <div class="flex flex-col mb-2 ">
                <label for="function">Funzione</label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="function" formControlName="function" placeholder="Funzione">
            </div>

            
            <hr class="my-4 lg:hidden border-[#acacac68]" />
            <div class="flex flex-col">
                <label>Email</label>
            </div>
            <div>
                <div formArrayName="emails">
                    <div *ngFor="let email of emailControls; let i = index" class="flex flex-row">
                        <div class="flex flex-col mb-2 w-full">
                            <input type="email" class="bg-secondary w-full p-2 rounded-md text-black" id="inputEmail" [formControlName]="i" placeholder="Email">
                        </div>

                        <button type="button"  *ngIf="i == 0" type="button" class="flex bg-secondary  text-primary ml-2 pl-2 pr-2 pt-2 pb-2 mb-2 rounded-full" (click)="addEmail()">
                            <mat-icon>add</mat-icon>
                        </button>
                        <button type="button"  *ngIf="i != 0" type="button" (click)="removeEmail(i)" class="flex bg-secondary  text-primary ml-2 pl-2 pr-2 pt-2 pb-2 mb-2 rounded-full">
                            <mat-icon>remove</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
            <hr class="my-4 lg:hidden border-[#acacac68]" />

            <div class="flex flex-col">
                <label>Numeri di telefono</label>
            </div>
            <div>
                <div formArrayName="phoneNumbers">
                    <div *ngFor="let phoneNumber of phoneNumberControls; let i = index" [formGroupName]="i" class="flex flex-row">
                        <div class="flex flex-col w-full">
                            <select class="bg-secondary w-full p-2 rounded-md text-black mb-2" formControlName="label" placeholder="">
                                <option value="work">Ufficio</option>
                                <option value="cell">Cellulare</option>
                                <option value="home">Casa</option>
                                <option value="other">Altro</option>
                                <!-- <option value="c">Casa</option> -->
                            </select>
                            <div class="flex w-full">
                                <div class="flex flex-col mb-2 w-full">
                                    <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" formControlName="number" placeholder="Numero di telefono">
                                </div>
                                <button type="button" *ngIf="i == 0" class="flex bg-secondary text-primary ml-2 pl-2 pr-2 pt-2 pb-2 mb-2 rounded-full" (click)="addPhoneNumber()">
                                    <mat-icon>add</mat-icon>
                                </button>
                                <button type="button" *ngIf="i != 0" (click)="removePhoneNumber(i)" class="flex bg-secondary text-primary ml-2 pl-2 pr-2 pt-2 pb-2 mb-2 rounded-full">
                                    <mat-icon>remove</mat-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                  
            </div>
            <hr class="my-4 lg:hidden border-[#acacac68]" />

            <div class="flex flex-col">
                <label>Sito web</label>
            </div>
            <div>
                <div formArrayName="links">
                    <div *ngFor="let link of linkControls; let i = index" class="flex flex-row">
                        <div class="flex flex-col mb-2 w-full">
                            <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="inputLink" [formControlName]="i" placeholder="Sito web">
                        </div>

                        <button type="button"  *ngIf="i == 0" type="button" class="flex  bg-secondary  text-primary ml-2 pl-2 pr-2 pt-2 pb-2 mb-2 rounded-full" (click)="addLink()">
                            <mat-icon>add</mat-icon>
                        </button>
                        <button type="button"  *ngIf="i != 0" type="button" (click)="removeLink(i)" class="flex bg-secondary  text-primary ml-2 pl-2 pr-2 pt-2 pb-2 mb-2 rounded-full">
                            <mat-icon>remove</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <hr class="my-4 lg:hidden border-[#acacac68]" />

        <div class="lg:flex lg:flex-col lg:w-1/2 lg:mt-8">
            <div class="flex flex-col mb-2 lg:mt-20">
                <label for="inputLinkedinLink">Linkedin </label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="inputLinkedinLink" placeholder="Link di condivisone del profilo" formControlName="linkedin" />
            </div>

            <div class="flex flex-col mb-2 ">
                <label for="inputInstagramLink">Instagram  </label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="inputInstagramLink" placeholder="Username" formControlName="instagram" />
            </div>
            
            <div class="flex flex-col mb-2 ">
                <label for="inputFacebookLink">Facebook  </label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="inputFacebookLink" placeholder="Link di condivisone del profilo" formControlName="facebook" />
            </div>

            <div class="flex flex-col mb-2 ">
                <label for="inputYoutubeLink">Youtube </label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="inputYoutubeLink" placeholder="Link di condivisone del profilo" formControlName="youtube" />
            </div>

            <div class="flex flex-col mb-2 ">
                <label for="inputWhatsappLink">Whatsapp </label>
                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="inputWhatsappLink" placeholder="+41 123 45 67" formControlName="whatsapp" />
            </div>

            <hr class="my-4 lg:hidden border-[#acacac68]" />
            <div class="flex flex-col mb-2 ">
                <label>Indirizzi</label>
            </div>
            
            <div>
                <div formArrayName="addresses">
                    <div *ngFor="let address of addresses.controls; let i = index" [formGroupName]="i">
                        <div class="flex flex-row w-full">
                            <div class="flex flex-col mb-2 w-1/2">
                                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" [formControlName]="street_name" id="inputAddressStreet"  placeholder="Via">
                            </div>
                            <div class="flex flex-col mb-2 w-1/2 pl-2">
                                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" [formControlName]="street_number"  id="inputAddressNumber" placeholder="Numero">
                            </div>
                        </div>     
                        <div class="flex flex-row w-full">
                            <div class="flex flex-col mb-2 w-1/2">
                                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" [formControlName]="cap"  id="inputAddressCap" placeholder="CAP">
                            </div>
                            <div class="flex flex-col mb-2 w-1/2 pl-2">
                                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" [formControlName]="city"  id="inputAddressCity" placeholder="Città">
                            </div>
                        </div>     
                        <div class="flex flex-row w-full">
                            <div class="flex flex-col mb-2 w-1/2">
                                <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" [formControlName]="nation"  id="inputAddressNation" placeholder="Nazione">
                            </div>
                            <button type="button"  *ngIf="i == 0" type="button" class="flex bg-secondary  text-primary ml-2 pl-2 pr-2 pt-2 pb-2 mb-2 rounded-full" (click)="addAddress()">
                                <mat-icon>add</mat-icon>
                            </button>
                            <button type="button"  *ngIf="i != 0" type="button" class="flex bg-secondary  text-primary ml-2 pl-2 pr-2 pt-2 pb-2 mb-2 rounded-full" (click)="removeAddress(i)">
                                <mat-icon>remove</mat-icon>
                            </button>
                        </div>  
                    </div>
                </div>        

            </div>
            <hr class="my-4 lg:hidden border-[#acacac68]" />


            <div class="flex flex-col items-start lg:mt-4">
                <app-primary-button text="Salva"></app-primary-button>
            </div>
        </div>
    </form>


    <form *ngIf="style" [formGroup]="myStyleForm" (ngSubmit)="onStyleSubmit()" class="lg:w-2/3 mt-4 lg:mt-16 lg:min-h-screen ">
        <div class="lg:flex lg:flex-row lg:w-full lg:justify-center flex-grow lg:items-center ">
            <div class="lg:flex lg:flex-col lg:w-1/2 lg:justify-start ">
                <div class="flex flex-col mb-4 lg:m-0">
                    <div class="flex flex-row justify-between align-middle lg:hidden">
                        <div class="w-20 h-20 overflow-hidden rounded-full">
                            <img src="{{ card.img }}" class="object-cover w-full h-full">
                        </div>
                        <div class="flex bg-primary text-background_color justify-center align-middle text-medium_text rounded-3xl h-10 w-24 pt-3">
                            <a href="/card-preview/{{card.token}}" class="flex">Preview</a>
                        </div>
                    </div>
                </div>
    
                <div class="flex flex-col lg:hidden">
                    <div class="flex flex-row justify-between">
                        <button type="button"  (click)="setStyleFalse()" class="flex bg-transparent  text-primary text-medium_text border border-primary pl-8 pr-8 pt-2 pb-2 mb-2 rounded-3xl">Modifica dati</button>
                        <button type="button"  (click)="setStyleTrue()" class="flex bg-primary  text-background_color text-medium_text pl-8 pr-8 pt-2 pb-2 mb-2 rounded-3xl">Modifica look</button>
                    </div>
                </div>
                
                <div class="flex flex-row mb-4 mt-10 justify-between px-2">
                    <label for="backgroundColor" class="flex w-4/5">Colore sfondo: </label>
                    <input type="color" id="backgroundColor" formControlName="backgroundColor" class="rounded-full" />
                </div>
                
                <div class="flex flex-row mb-4  justify-between px-2">
                    <label for="textColor" class="flex w-4/5">Colore del testo: </label>
                    <input type="color" id="textColor" formControlName="textColor" class="rounded-full" />
                </div>
                
                <div class="flex flex-row mb-4  justify-between px-2">
                    <label for="buttonColor" class="flex w-4/5">Colore del bottone: </label>
                    <input type="color" id="buttonColor" formControlName="buttonColor" class="rounded-full" />
                </div>
                
                <div class="flex flex-col items-center mt-12 lg:mt-8">
                    <app-primary-button text="Salva"></app-primary-button>
                </div>
            </div>
            
            <div *ngIf="style && !isLoading" class="lg:flex sm:hidden lg:w-1/2 justify-end place-items-end ml-4 ">
                <div class="flex max-w-80">
                    <app-card-preview [card]="card" class="lg:w-96"></app-card-preview>
                </div>
            </div>
        </div>
    </form>

</div>


<div *ngIf="isVisible" class="fixed z-10 top-8 w-screen flex items-center justify-center -ml-8">
    <div class="bg-primary text-black pr-8 pl-8 pt-2 pb-2 rounded-full font-bold">
      Salvato con successo
    </div>
</div>
