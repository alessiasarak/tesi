<div class="flex xl:flex-row xl:w-full sm:flex-col justify-center">
    <div class="flex flex-col mt-10 items-center ml-10 sm:ml-1">
        <div class="flex flex-col w-96 shadow-xl p-8 rounded-3xl">
            
            <h3 class="flex text-xl font-bold mb-3">
                <app-my-button path="/settings"></app-my-button>
                Impostazioni delle carte
            </h3>

            <form [formGroup]="myStyleForm" (ngSubmit)="onStyleSubmit()">
              
                <div class="flex flex-col mb-2">
                  <div class="flex flex-col items-center">
                      <img src="{{ card.img }}" class="flex h-36 mb-3 rounded-full">
                  </div>
                </div>

                <div class="flex flex-col mb-3 w-80">
                  <label for="img">Image</label>
                  <input type="file" accept=".jpg, .jpeg, .png" 
                  (change)="processFile($event)" class="form-control" id="img" 
                  formControlName="img" placeholder="Image" maxFileSize="5 * 1024 * 1024">
                </div>
                
                <div class="flex flex-row mb-3 w-80">
                    <label for="backgroundColor" class="flex w-4/5">Colore sfondo: </label>
                    <input type="color" id="backgroundColor" formControlName="backgroundColor" />
                </div>
                
                <div class="flex flex-row mb-3 w-80">
                    <label for="textColor" class="flex w-4/5">Colore del testo: </label>
                    <input type="color" id="textColor" formControlName="textColor"/>
                </div>
                
                <div class="flex flex-row mb-3 w-80">
                    <label for="buttonColor" class="flex w-4/5">Colore del bottone: </label>
                    <input type="color" id="buttonColor" formControlName="buttonColor" />
                </div>
                
                <div class="flex flex-col items-center">
                    <button type="submit" class="flex bg-slate-200 pl-8 pr-8 pt-2 pb-2 mb-3 rounded-3xl">Save change</button>
                </div>
            </form>
        </div>    
    </div>

    
    <div class="flex flex-col mt-10 mb-10 items-center ml-10 sm:ml-1">
        <div [ngClass]="myMainClass" [style]="myMainStyle">
            
            <h3 class="flex text-xl font-bold mb-3">
                Risultato dei colori
            </h3>

            <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

            <div class="flex flex-col mb-2">
                <div class="flex flex-col items-center">
                    <img *ngIf="card.img" src="{{ card.img }}" class="flex h-36 mb-3 rounded-full">
                  
                    <h4 class="flex h-1/4 mb-1 font-bold text-left text-2xl">Nome cognome</h4>
                    <h5 class="flex h-1/4 mt-3 text-left">Azienda</h5>
                    <h5 class="flex h-1/4 mb-3 text-left">Funzione</h5>

                    <button [ngClass]="myButtonClass" [style]="myButtonStyle">AGGIUNGI AI CONTATTI</button>
                </div>

                <hr class="flex mt-3 mb-3">

                <div class="center" class="flex flex-col">
                    <div class="flex flex-row mb-3" >
                        <mat-icon aria-hidden="false" fontIcon="email" class="flex"></mat-icon>
                        <span class="flex ml-3">Email</span>
                    </div>

                    <div class="flex flex-row mb-3">
                        <mat-icon aria-hidden="false" fontIcon="phone" class="flex"></mat-icon>
                        <span class="flex ml-3">Numero di telefono</span>
                    </div>

                    <div class="flex flex-row mb-3">
                        <mat-icon aria-hidden="false" fontIcon="link" class="flex"></mat-icon>
                        <a class="flex ml-3">Link</a>
                    </div>

                    <div class="flex flex-row mb-3">
                        <mat-icon aria-hidden="false" fontIcon="location_on" class="flex"></mat-icon>
                        <span class="flex ml-3">Indirizzo</span>
                    </div>
                </div>

                <hr class="flex mt-3 mb-3">
                

                <div class="flex flex-row w-full justify-around">
                    <div class="flex w-1/5 rounded-full" *ngIf="card.facebook">
                      <a href="{{ card.facebook }}" target="_blank">
                        <mat-icon fontIcon="facebook"></mat-icon>
                      </a>
                    </div>
                    <div class="flex w-1/5 rounded-full" *ngIf="card.instagram">
                      <a href="{{ card.instagram }}" target="_blank">
                        <mat-icon fontIcon="link"></mat-icon>
                      </a>
                    </div>
                    <div class="flex w-1/5 rounded-full" *ngIf="card.linkedin">
                      <a href="{{ card.linkedin }}" target="_blank">
                        <mat-icon fontIcon="link"></mat-icon>
                      </a>
                    </div>
                    <div class="flex w-1/5 rounded-full" *ngIf="card.whatsapp">
                      <a href="{{ card.whatsapp }}" target="_blank">
                        <mat-icon fontIcon="link"></mat-icon>
                      </a>
                    </div>
                    <div class="flex w-1/5 rounded-full" *ngIf="card.youtube">
                      <a href="{{ card.youtube }}" target="_blank">
                        <mat-icon fontIcon="link"></mat-icon>
                      </a>
                    </div>
                  </div>
              
                  <div class="flex w-full items-center text-center justify-center">
                    <div class="flex">Powered by Hexcard</div>
                  </div>
            </div>
        </div>
    </div>
</div>
