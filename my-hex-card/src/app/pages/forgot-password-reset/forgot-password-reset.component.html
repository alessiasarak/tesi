
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<div class="flex lg:flex-row lg:justify-between sm:flex-col lg:h-screen lg:align-middle lg:pt-[15%]">

<div class="sm:hidden lg:flex lg:flex-col">
  <app-title title="Recupero password" class="flex"></app-title>
  <app-subtitle subtitle="Imposta la nuova password per accedere!"></app-subtitle>
</div>

<form [formGroup]="myPasswordForm" (ngSubmit)="onPasswordSubmit()" class="flex sm:flex-col lg:flex-row sm:min-h-screen sm:justify-center">

  <div class="sm:flex sm:flex-col lg:hidden">
    <app-title title="Recupero password" class="flex"></app-title>
    <app-subtitle subtitle="Imposta la nuova password per accedere!"></app-subtitle>
  </div>
  
  <div class="lg:flex lg:flex-col">
    <div class="mb-4"  *ngIf="showPassword">
      <div class="flex items-center border-b border-gray-500 py-2">
        <input class="appearance-none bg-transparent border-none w-full text-white mr-3 py-1 px-2 leading-tight focus:outline-none"
        placeholder="Password*" type="text" id="newPassword" formControlName="newPassword">
        <span class="text-gray-500" (click)="togglePassword()">
          <mat-icon class="flex">visibility_off</mat-icon>
        </span>
      </div>
    </div>


    <div class="mb-4"  *ngIf="!showPassword">
      <div class="flex items-center border-b border-gray-500 py-2">
        <input class="appearance-none bg-transparent border-none w-full text-white mr-3 py-1 px-2 leading-tight focus:outline-none"
        placeholder="Password*" type="password" id="newPassword" formControlName="newPassword">
        <span class="text-gray-500" (click)="togglePassword()">
          <mat-icon class="flex">visibility</mat-icon>
        </span>
      </div>
    </div>
    



    <div class="mb-4"  *ngIf="showPassword">
      <div class="flex items-center border-b border-gray-500 py-2">
        <input class="appearance-none bg-transparent border-none w-full text-white mr-3 py-1 px-2 leading-tight focus:outline-none"
        placeholder="COnferma password*" type="text" id="repeatedPassword" formControlName="repeatedPassword">
        <span class="text-gray-500" (click)="togglePassword()">
          <mat-icon class="flex">visibility_off</mat-icon>
        </span>
      </div>
    </div>


    <div class="mb-4"  *ngIf="!showPassword">
      <div class="flex items-center border-b border-gray-500 py-2">
        <input class="appearance-none bg-transparent border-none w-full text-white mr-3 py-1 px-2 leading-tight focus:outline-none"
        placeholder="Conferma password*" type="password" id="repeatedPassword" formControlName="repeatedPassword">
        <span class="text-gray-500" (click)="togglePassword()">
          <mat-icon class="flex">visibility</mat-icon>
        </span>
      </div>
    </div>
  </div>

  
  <div class="lg:block lg:absolute  lg:top-[55%] lg:right-20">
    
    <div *ngIf="isVisible" class="text-red-400 pb-6 w-full">
      {{ passwordError}}
    </div>
    <div class="flex flex-col items-center">
      <button type="submit" class="flex bg-primary  text-black pl-8 pr-8 pt-4 pb-4 mb-3 rounded-full">Salva</button>
    </div>
  </div>
</form>

</div>
