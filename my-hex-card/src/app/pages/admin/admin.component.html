<div class="p-10">
  <div class="flex flex-col border ">
      <div class="flex flex-row font-bold">
          <div class="flex w-1/4 border p-2">
            Nome
          </div>
          <div class="flex w-1/4 border p-2">
            Cognome
          </div>
          <div class="flex w-1/4 border p-2">
            Email
          </div>
          <div class="flex w-1/4 border p-2">
            Carte collegate
          </div>
      </div>

      <div class="flex flex-col" *ngFor="let contact of contacts">
        <div class="flex flex-row">
          <div class="flex w-1/4 border p-2">
            {{ contact.name }}
          </div>
          <div class="flex w-1/4 border p-2">
            {{ contact.surname }}
          </div>
          <div class="flex w-1/4 border p-2">
            {{ contact.email }}
          </div>
          <div class="flex w-1/4 border p-2 justify-center">
            <button (click)="seeContactCards(contact.id)" class="bg-slate-200 w-44 rounded-3xl p-2">Vedi carte</button>
          </div>
        </div>
      </div>
  </div>
  <div class="flex flex-col w-full items-center">
    <button (click)="addContact()" class="bg-slate-200 w-44 rounded-3xl mt-6 mb-6 p-2">Aggiungi utente</button>
    <button (click)="logout()" class="bg-slate-200 w-44 rounded-3xl p-2">Logout</button>
  </div>
</div>
