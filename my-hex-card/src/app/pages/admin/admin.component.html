<app-loading *ngIf="isLoading"></app-loading>


<div class="lg:pl-96 lg:pr-96 mt-20">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <app-title title="Amministrazione"></app-title>
  <app-subtitle subtitle="Gestisci tutti i contatti presenti e le loro carte"></app-subtitle>

  <div class=" mt-4" >
    <div *ngFor="let contact of contacts">
      <div class="pb-2">
          <div class="flex flex-row justify-between text-subtitle">
              <div class="flex flex-col">
                  <div class="flex">{{ contact.email }}</div>
                  <div class="flex">{{ contact.company }}</div>
              </div>
              <div class="flex flex-col cursor-pointer text-medium_text lg:flex-row lg:text-subtitle">
                <a class="flex text-primary underline lg:mr-4" (click)="seeContactCards(contact.id)">vedi carte</a>
                <a class="flex text-primary underline" (click)="delete(contact)">elimina</a>
              </div>
          </div>
      </div>
      <hr class="pt-2">
    </div>
  </div>

  <div class="flex flex-col w-full items-end">
    <app-plus-button (action)="addContact()"></app-plus-button>
    <!-- <button type="button" class="flex text-primary rounded-full" (click)="addContact()">
      <mat-icon>add_circle_outline</mat-icon>
    </button> -->
  </div>
</div>
