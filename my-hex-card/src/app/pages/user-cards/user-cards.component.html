
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<app-title title="Amministrazione"></app-title>

<div class="shadow-lg rounded-md p-2 mb-4" >
  <div class="flex flex-row mb-3 justify-between">
      <label for="textColor" class="flex text-[20px] font-[700]">QR Code: </label>
      <a class="flex text-primary text-medium_text underline">Preview</a>
  </div>

  <div class="flex flex-row mb-3 justify-between">
    <label for="backgroundColor" class="flex text-[20px] font-[400]">Colore sfondo: </label>
    <input type="color" id="backgroundColor" (change)="changeBackgroundColor($event)"/>
  </div>
  
  <div class="flex flex-row mb-3 justify-between">
      <label for="textColor" class="flex text-[20px] font-[400]">Colore del codice: </label>
      <input type="color" id="codColor" (change)="changeCodeColor($event)"/>
  </div>
</div>

<div class="shadow-lg rounded-md p-2" >
  <div *ngFor="let card of cards; index as i">
    <div class="pb-2">
        <div class="flex flex-col text-subtitle">
          <div class="flex text-[20px] font-[700]">{{ card.name }} {{ card.surname }}</div>
          <div class="flex flex-row w-full justify-between">
              <div class="flex">Link da associare</div>
              <a class="flex text-primary text-medium_text underline"  (click)="copy(link + card.token)">Copia</a>
          </div>
          <div class="flex flex-row w-full justify-between">
            <div class="flex">QR code</div>
            <a class="flex text-primary text-medium_text underline" [href]="card.qrCode" download="qrcode">Scarica</a>
          </div>
        </div>
    </div>
    <hr class="pt-2">
  </div>
</div>

<div class="flex flex-col w-full items-end">
  <button type="button" class="flex bg-primary  text-black pl-2 pr-2 pt-2 pb-2 mb-3 rounded-full" (click)="addCard()">
    <mat-icon>add</mat-icon>
  </button>
</div>
