<div class="p-10">
    <h3 class="flex text-xl font-bold mb-3">
        <app-my-button path="/admin"></app-my-button>
        Dettagli carte utente {{ email }}
    </h3>
    <div class="flex flex-col border ">
        <div class="flex flex-row font-bold">
            <div class="flex w-1/6 border p-2">
              ID
            </div>
            <div class="flex w-5/6 border p-2">
              Link da associare
            </div>
        </div>
  
        <div class="flex flex-row" *ngFor="let card of cards">
          <div class="flex w-1/6 border p-2">
            {{ card.id }}
          </div>
          <div class="flex w-5/6 border p-2">
            <a href="{{ link + card.id }}">{{ link + card.id }}</a>
          </div>
        </div>
    </div>
