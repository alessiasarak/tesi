<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


<form [formGroup]="myProfileForm" (ngSubmit)="onProfileSubmit()" class="lg:flex lg:flex-col lg:min-h-screen justify-center">
  <div class="flex lg:flex-row sm:flex-col w-full justify-between">
    <app-title title="Invia email di recupero" class="flex lg:w-1/3"></app-title>
    <div class="lg:flex lg:flex-row lg:w-2/3 lg:pl-32">
      <div class="flex items-center border-b border-gray-500 py-2 lg:mr-4 mb-4 w-full">
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="appearance-none bg-transparent border-none w-full text-white mr-3 py-1 px-2 leading-tight focus:outline-none"
          placeholder="E-mail">
        <span class="text-gray-500">
          <mat-icon class="flex">person</mat-icon>
        </span>
      </div>
    </div>
  </div>
  
  <div class="lg:flex lg:flex-row">
    <div class="w-full">
      <div class="flex flex-col items-center lg:items-end">
        <button type="submit" class="bg-primary text-black pl-8 pr-8 pt-4 pb-4 mb-3 rounded-full">Invia e-mail</button>
      </div>
    </div>
  </div>
</form>
