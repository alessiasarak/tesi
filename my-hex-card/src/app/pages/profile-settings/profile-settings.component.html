<app-loading *ngIf="isLoading"></app-loading>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<div class="flex flex-col flex-grow min-h-screen justify-center">

    <div class="flex lg:flex-row lg:justify-around sm:flex-col lg:pl-44 lg:pr-44">
        <div class="lg:flex lg:flex-col lg:w-1/3 lg:justify-center flex-grow min-h-full">
            <app-title title="Profilo"></app-title>
            <app-subtitle subtitle="Imposta le tue preferenze"></app-subtitle>
        </div>
        
        <div class="lg:flex lg:flex-row lg:w-1/3 mt-4">
            <form [formGroup]="myProfileForm" (ngSubmit)="onProfileSubmit()" class="w-full mr-4 lg:flex lg:flex-col lg:w-1/3 lg:justify-center flex-grow min-h-full">
                <div class="flex flex-col mb-6 w-full">
                    <label for="email">Email</label>
                    <input type="text" class="bg-secondary w-full p-2 rounded-md text-black" id="email" formControlName="email" />
                </div>
                        
                <div class="flex flex-col items-center">
                    <button type="submit" class="flex bg-primary  text-black pl-8 pr-8 pt-2 pb-2 mb-3 rounded-3xl">Salva</button>
                </div>
            </form>
        </div>

        <hr class="my-4 lg:hidden" />

        <div class="lg:flex lg:flex-row lg:w-1/3 mt-4">
            <form [formGroup]="myPasswordForm" (ngSubmit)="onPasswordSubmit()"  class="w-full lg:flex lg:flex-col lg:w-1/3 lg:justify-center flex-grow min-h-full">
                <div class="flex flex-col mb-3 text-secondary_text">
                    <p class="mb-2 font-title text-primary_text">Requisiti della password</p>
                    <p class="small text-muted mb-2">Per creare una nuova password, rispetta i seguenti requisiti:</p>
                    <ul class="small text-muted pl-4 mb-0">
                        <li>- Minimo 8 caratteri</li>
                        <li>- Almeno un numero</li>
                    </ul>
                </div>
                
                <div class="flex flex-col mb-3 ">
                    <label for="password">Vecchia password</label>
                    <input type="password" class="bg-secondary w-full p-2 rounded-md text-black" id="password"  formControlName="password" />
                </div>
        
                <div *ngIf="isVisible" class="text-red-400 pb-6 w-full">
                    {{ passwordError}}
                </div>
                
                <div class="flex flex-col mb-3">
                    <label for="newPassword">Nuova password</label>
                    <input type="password" class="bg-secondary w-full p-2 rounded-md text-black" id="newPassword"  formControlName="newPassword" (keyup)="checkPasswordValidity()"/>
                </div>
                
                <div class="flex flex-col mb-6">
                    <label for="repeatedPassword">Conferma Password</label>
                    <input type="password" class="bg-secondary w-full p-2 rounded-md text-black" id="repeatedPassword"  formControlName="repeatedPassword" (keyup)="checkPasswordValidity()" />
                </div>
                
                <div class="flex flex-col items-center">
                    <button type="submit" class="flex bg-primary  text-black pl-8 pr-8 pt-2 pb-2 mb-3 rounded-3xl">Salva</button>
                </div>
            </form>
        </div>

        
    </div>
</div>
