<app-loading *ngIf="isLoading"></app-loading>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<form [formGroup]="myForm" (ngSubmit)="onSubmit()" class="flex flex-col flex-grow min-h-screen justify-center">
  <!--Fixed worka per quello che intendevo, gli elemnti dentro non si centrano-->
  <div class="flex lg:flex-row sm:flex-col w-full justify-between">
    <div>
      <app-title title="Bentornato!" class="flex lg:w-1/3"></app-title>
      <app-subtitle subtitle="Effettua il login per accedere alla gestione delle tue carte digitali!"></app-subtitle>
    </div>

    <div *ngIf="isVisible" class="lg:hidden text-red-400 pb-6 w-full">
      Errore nel login
    </div>

    <div class="lg:flex lg:flex-row lg:w-2/3 lg:pl-32 mt-4 lg:mt-0">
      <div class="flex items-center border-b border-gray-500 py-2 lg:mr-4 mb-4 w-full">
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          class="appearance-none bg-transparent border-none w-full text-white mr-3 py-1 px-2 leading-tight focus:outline-none"
          placeholder="E-mail">
        <span class="text-gray-500">
          <mat-icon class="flex">person</mat-icon>
        </span>
      </div>

      <div class="flex items-center border-b border-gray-500 py-2 mb-4 w-full">
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          id="password" 
          formControlName="password" 
          class="appearance-none bg-transparent border-none w-full text-white mr-3 py-1 px-2 leading-tight focus:outline-none"
          placeholder="Password">
        <span class="text-gray-500" (click)="togglePassword()">
          <mat-icon class="flex" *ngIf="showPassword">visibility_off</mat-icon>
          <mat-icon class="flex" *ngIf="!showPassword">visibility</mat-icon>
        </span>
      </div>
    </div>
  </div>
  
  <div class="lg:flex lg:flex-row">
    <div class="flex flex-row w-full justify-end text-medium_text font-medium mb-4 lg:hidden cursor-pointer">
      <a class="flex text-primary underline" (click)="forgotPassword()">Password dimenticata?</a>
    </div>

    <div class="w-full">
      <div class="flex flex-col items-center lg:items-end">
        <div *ngIf="isVisible" class="sm:hidden lg:flex pb-6">
          Errore nel login
        </div>
        <button type="submit" class="bg-primary text-black pl-8 pr-8 pt-4 pb-4 mb-3 rounded-full">Login</button>

        <div class="flex flex-row w-full justify-end text-medium_text font-medium mb-4 lg:flex sm:hidden lg:text-right cursor-pointer">
          <a class="flex text-primary underline" (click)="forgotPassword()">Password dimenticata?</a>
        </div>

        <div class="flex flex-row w-full justify-center text-tiny_text font-normal cursor-pointer" *ngIf="token">
          <div class="mr-2">Non sei registrato?</div>
          <a class="text-primary" (click)="register()">Crea un account!</a>
        </div>
      </div>
    </div>
  </div>
</form>
