<div class="flex flex-col mt-10 items-center">
  <div class="flex flex-col w-96 shadow-xl p-8 rounded-3xl">
    <h3 class="flex text-xl font-bold mb-3">
        <app-my-button path="/admin"></app-my-button>
        Aggiungi utente
    </h3>

    <form [formGroup]="myForm" (ngSubmit)="onSubmit()">

      <div class="flex flex-col mb-3 w-80">
        <label for="title">Email</label>
        <input type="email" class="form-control" id="email" formControlName="email" placeholder="Email">
      </div>
      
      <div class="flex flex-col mb-3 w-80">
        <label for="name">Name</label>
        <input type="name" class="form-control" id="name" formControlName="name" placeholder="name">
      </div>
      
      <div class="flex flex-col mb-3 w-80">
        <label for="surname">Cognome</label>
        <input type="surname" class="form-control" id="surname" formControlName="surname" placeholder="surname">
      </div>

      <div class="flex flex-col mb-3 w-80">
        <label for="title">Azienda</label>
        <input type="role" class="form-control" id="company" formControlName="company" placeholder="company">
      </div>
      <div class="flex flex-col items-center">
        <button type="submit" class="flex bg-primary  text-black pl-8 pr-8 pt-2 pb-2 mb-3 rounded-3xl">Aggiungi utente</button>
    </div>
    </form>
  </div>
</div>
