<div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="card-header">
            <h3>Registrati</h3>
          </div>

          <div class="card-body">
            <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" formControlName="email" placeholder="Email">
                </div>
              <div class="mb-3">
                <input type="name" class="form-control" id="name" formControlName="name" placeholder="name">
              </div>
              <div class="mb-3">
                <input type="surname" class="form-control" id="surname" formControlName="surname" placeholder="surname">
              </div>
              <div class="mb-3">
                <input type="role" class="form-control" id="role" formControlName="role" placeholder="role">
              </div>
              
              <button type="submit" class="btn btn-primary">Aggiungi utente</button>
            </form>
            <hr>
          </div>
        </div>
      </div>
    </div>
  </div>
