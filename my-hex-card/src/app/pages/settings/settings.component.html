<app-loading *ngIf="isLoading"></app-loading>

<div class="flex lg:flex-row lg:justify-between sm:flex-col lg:pl-44 lg:pr-44">
  
  <div class="lg:flex lg:flex-col">
    <app-title title="Morning!"></app-title>

    <div *ngIf="cards.length > 1" class="flex flex-col items-center mt-4 lg:block sm:hidden">
      <a href="card-settings/style/set-all-style-cards" class="bg-primary  text-black w-44 rounded-3xl p-2">Impostazioni carte</a>
    </div>
  </div>

  <swiper-container class="w-full lg:w-80 " effect="cards">
    @for (card of cards; track card.token; let idx = $index) {
      <swiper-slide class="w-full h-[44rem] overflow-y-scroll swiper-vertical" (click)="viewDetailCard(card.token)">
        <app-card-preview [card]="card"></app-card-preview>
      </swiper-slide>
    }
  </swiper-container>

  <div *ngIf="cards.length > 1" class="flex flex-col items-center mt-4 lg:hidden">
    <a href="card-settings/style/set-all-style-cards" class="bg-primary  text-black rounded-3xl p-2">Impostazioni carte</a>
  </div>
</div>
