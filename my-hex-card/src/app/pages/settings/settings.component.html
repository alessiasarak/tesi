<app-loading *ngIf="isLoading"></app-loading>

<div class="flex flex-col flex-grow min-h-screen justify-center">
  <div class="flex lg:flex-row lg:justify-between sm:flex-col lg:pl-44 lg:pr-44 sm:mt-20">
    
    <div class="lg:flex lg:flex-col lg:justify-center flex-grow min-h-full lg:w-1/3">
      <app-title title="Benvenuto!"></app-title>
      <app-subtitle *ngIf="cards.length > 1" subtitle="Qui puoi trovare i tuoi biglietti da visita digitali e modificarli!"></app-subtitle>
      <app-subtitle *ngIf="cards.length == 1" subtitle="Qui puoi trovare il tuo biglietto da visita digitale e modificarlo!"></app-subtitle>

      <div *ngIf="cards.length > 1" class="flex flex-col items-center mt-8 lg:block sm:hidden ">
        <a href="card-settings/style/set-all-style-cards" class="bg-primary !text-background_color w-44 rounded-3xl pr-4 pl-4 pt-2 pb-2 text-[14px]">Stile carte</a>
      </div>
    </div>

    <div class="lg:flex lg:items-center lg:justify-center flex-grow min-h-full lg:w-2/3 mt-8 mb-4">
      <swiper-container class="w-full lg:w-72 " effect="cards">
        @for (card of cards; track card.token; let i = $index) {
          <swiper-slide class="w-full overflow-y-scroll swiper-vertical bg-[#fff] rounded-3xl" (click)="viewDetailCard(card.token)">
            <div class="w-full h-[30rem] overflow-y-scroll swiper-vertical rounded-b-3xl">
              <app-card-preview [card]="card" [edit]="true"></app-card-preview>
            </div>
          </swiper-slide>
        }
      </swiper-container>
    </div>

    <div *ngIf="cards.length > 1" class="flex flex-col items-center p-4 mt-4 lg:hidden">
      <a href="card-settings/style/set-all-style-cards" class="bg-primary  !text-background_color rounded-3xl p-2 px-4">Stile carte</a>
    </div>
  </div>
</div>
