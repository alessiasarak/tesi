<app-title title="Morning!"></app-title>

<swiper-container class="w-full" effect="cards">
  @for (card of cards; track card.token; let idx = $index) {
    <swiper-slide class="w-full" (click)="viewDetailCard(card.token)">
      <!-- href="/card-settings/{{ card.token }}" -->
      <app-card-preview [card]="card"></app-card-preview>
    </swiper-slide>
  }
</swiper-container>

<div *ngIf="cards.length > 1" class="flex flex-col items-center mt-4">
  <!-- <button (click)="logout()" class="bg-primary  text-black w-44 rounded-3xl p-2">Logout</button> -->
  <button (click)="logout()" class="bg-primary  text-black w-44 rounded-3xl p-2">Impostazioni carte</button>
</div>
