<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">


<div class="flex flex-col flex-grow min-h-screen justify-center">
    <div class="flex lg:flex-row sm:flex-col w-full justify-between">
        <div class="flex flex-col">
            <app-title title="Il tuo nuovo biglietto da visita NFC!" class="flex"></app-title>
            <app-subtitle *ngIf="!token" subtitle="Effettua il login o richiedi una carta!"></app-subtitle>
            <app-subtitle *ngIf="token" subtitle="Effettua il login o registrati!"></app-subtitle>
        </div>
        <div class="flex flex-col justify-end mt-8">
            <app-primary-button text="Login" (click)="login()"></app-primary-button>
            <app-secondary-button *ngIf="token" text="Sign up" (click)="register()"></app-secondary-button>
        </div>
    </div>
</div>
